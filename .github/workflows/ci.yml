name: Universal Console Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Environment check
        run: npm run check
      - name: Recompiler and loader tests
        run: npm test
      - name: Start server
        run: |
          npm start > /tmp/universal-runtime.log 2>&1 &
          echo $! > /tmp/universal-runtime.pid
          sleep 2
      - name: Verify control plane and browser tools
        run: |
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/gpu-host
          curl --fail http://127.0.0.1:3000/api/games
          curl --fail http://127.0.0.1:3000/stream.html
          curl --fail http://127.0.0.1:3000/play-n64.html
          curl --fail http://127.0.0.1:3000/universal.html
          curl --fail http://127.0.0.1:3000/recompiler.html
          curl --fail http://127.0.0.1:3000/recompiler-core.js
          curl --fail http://127.0.0.1:3000/ppc-lab.html
          curl --fail http://127.0.0.1:3000/ppc-core.js
          curl --fail http://127.0.0.1:3000/ppc-module.js
          curl --fail http://127.0.0.1:3000/ppc-state.js
          curl --fail http://127.0.0.1:3000/ppc-linker.js
          curl --fail http://127.0.0.1:3000/ppc-linked-wasm.js
          curl --fail http://127.0.0.1:3000/xbox-runtime.js
          curl --fail http://127.0.0.1:3000/linked-wasm-lab.html
          curl --fail http://127.0.0.1:3000/function-lab.html
          curl --fail http://127.0.0.1:3000/ppc-functions.js
          curl --fail http://127.0.0.1:3000/xex-lab.html
          curl --fail http://127.0.0.1:3000/xex-parser.js
          curl --fail http://127.0.0.1:3000/xex-loader.js
          curl --fail http://127.0.0.1:3000/xex-normal.js
          curl --fail http://127.0.0.1:3000/pe-parser.js
      - name: Verify launch flow
        run: |
          curl --fail -X POST \
            -H 'Content-Type: application/json' \
            -d '{"gameId":"stream-lab"}' \
            http://127.0.0.1:3000/api/launch
          curl --fail -X POST \
            -H 'Content-Type: application/json' \
            -d '{"gameId":"mkart360"}' \
            http://127.0.0.1:3000/api/launch
          curl --fail http://127.0.0.1:3000/api/sessions
      - name: Stop server
        if: always()
        run: |
          test -f /tmp/universal-runtime.pid && kill $(cat /tmp/universal-runtime.pid) || true
